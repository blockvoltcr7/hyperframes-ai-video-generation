  <script>
    (() => {
      const byId = (id) => document.getElementById(id);
      const pluginStage = byId("f01-capability-bundle-plugin-stage");
      const pluginWord = byId("f01-capability-bundle-plugin");
      const underline = byId("f01-capability-bundle-underline");
      const wrongStage = byId("f01-capability-bundle-wrong-stage");
      const token = byId("f01-capability-bundle-token");
      const strike = byId("f01-capability-bundle-strike");
      const networkStage = byId("f01-capability-bundle-network-stage");
      const bloom = byId("f01-capability-bundle-bloom");
      const capability = byId("f01-capability-bundle-capability");
      const bundle = byId("f01-capability-bundle-bundle");
      const outcome = byId("f01-capability-bundle-outcome");
      const outcomeLink = byId("f01-capability-bundle-outcome-link");
      const pulse = byId("f01-capability-bundle-pulse");
      const pulseGlow = byId("f01-capability-bundle-pulse-glow");
      const links = ["a", "b", "c", "d"].map((key) => byId(`f01-capability-bundle-link-${key}`));
      const nodes = ["a", "b", "c", "d"].map((key) => byId(`f01-capability-bundle-node-${key}`));

      const tl = gsap.timeline({ paused: true });
      window.__timelines = window.__timelines || {};
      window.__timelines["01-capability-bundle"] = tl;

      tl.fromTo(
        pluginWord,
        { scale: 1.22, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.35, ease: "power3.out" },
        0,
      );
      tl.fromTo(
        underline,
        { scaleX: 0, opacity: 0 },
        { scaleX: 1, opacity: 1, duration: 0.5, ease: "power3.out" },
        0.22,
      );

      tl.to(pluginStage, { x: -230, opacity: 0, duration: 0.3, ease: "power4.in" }, 1.72);
      tl.fromTo(
        wrongStage,
        { x: 230, opacity: 0 },
        { x: 0, opacity: 1, duration: 0.3, ease: "power4.out" },
        2.02,
      );

      const tokenStates = [
        { t: 0, text: "tool" },
        { t: 1.15, text: "button" },
        { t: 2.3, text: "shortcut" },
      ];
      const tokenAt = (time) => {
        for (let i = tokenStates.length - 1; i >= 0; i -= 1) {
          if (time >= tokenStates[i].t) return tokenStates[i].text;
        }
        return "tool";
      };
      const tokenDriver = { t: 0 };
      tl.to(tokenDriver, {
        t: 3.6,
        duration: 3.6,
        ease: "none",
        onUpdate: () => { token.textContent = tokenAt(tokenDriver.t); },
      }, 2.0);
      tl.fromTo(
        strike,
        { scaleX: 0, opacity: 0 },
        { scaleX: 1, opacity: 1, duration: 0.42, ease: "power3.out" },
        4.82,
      );

      tl.to(wrongStage, { x: -230, opacity: 0, duration: 0.32, ease: "power4.in" }, 5.28);
      tl.fromTo(
        networkStage,
        { x: 230, opacity: 0 },
        { x: 0, opacity: 1, duration: 0.34, ease: "power4.out" },
        5.6,
      );

      tl.fromTo(
        capability,
        { x: 150, opacity: 0 },
        { x: 0, opacity: 1, duration: 0.72, ease: "power3.out" },
        5.62,
      );
      tl.fromTo(
        bundle,
        { x: -150, opacity: 0 },
        { x: 0, opacity: 1, duration: 0.72, ease: "power3.out" },
        5.66,
      );
      tl.fromTo(
        bloom,
        { opacity: 0, scale: 0.84 },
        { opacity: 0.26, scale: 1, duration: 1.05, ease: "power2.out" },
        5.68,
      );

      links.forEach((link, index) => {
        tl.to(link, { strokeDashoffset: 0, duration: 0.64, ease: "power2.out" }, 6.12 + index * 0.08);
      });
      nodes.forEach((node, index) => {
        const dx = Number(node.dataset.dx);
        const dy = Number(node.dataset.dy);
        tl.fromTo(
          node,
          { x: 0, y: 0, scale: 0, opacity: 0 },
          { x: dx, y: dy, scale: 1, opacity: 1, duration: 0.62, ease: "power3.out" },
          6.36 + index * 0.08,
        );
      });

      tl.to(outcomeLink, { strokeDashoffset: 0, duration: 0.72, ease: "power2.out" }, 8.18);
      tl.fromTo(
        pulseGlow,
        { strokeDashoffset: 1, opacity: 0 },
        { strokeDashoffset: 0, opacity: 0.24, duration: 1.08, ease: "none" },
        8.34,
      );
      tl.fromTo(
        pulse,
        { strokeDashoffset: 1, opacity: 0 },
        { strokeDashoffset: 0, opacity: 1, duration: 1.08, ease: "none" },
        8.34,
      );
      tl.to([pulse, pulseGlow], { opacity: 0, duration: 0.22, ease: "power1.out" }, 9.42);
      tl.fromTo(
        outcome,
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.58, ease: "power3.out" },
        9.1,
      );
    })();
  </script>
