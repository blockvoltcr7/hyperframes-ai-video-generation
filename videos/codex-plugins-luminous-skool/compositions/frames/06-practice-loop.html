      const typedState = { count: 0 };
      const blinkState = { t: 0 };

        t: 15,
        duration: 15,
        ease: "none",
        onUpdate: () => {
          const typing = blinkState.t >= 0.48 && blinkState.t <= 2.68;

        const chip = byId(`f06-practice-loop-chip-${index + 1}`);
        const route = byId(`f06-practice-loop-route-${index + 1}`);
        tl.to(route, { strokeDashoffset: 0, duration: 0.7, ease: "power2.out" }, at - 0.12);
        tl.to(chip, { x: target.x * 0.1, y: target.y * 0.1, duration: 0.14, ease: "power3.in" }, at);
        tl.to(chip, { x: target.x * 0.75, y: target.y * 0.75, duration: 0.12, ease: "none" }, at + 0.14);
        tl.to(chip, { x: target.x, y: target.y, scale: 0.42, duration: 0.44, ease: "power4.out" }, at + 0.26);
        tl.to(chip, { opacity: 0, duration: 0.32, ease: "power1.in" }, at + 0.44);

      tl.fromTo(byId("f06-practice-loop-result-glow"), { opacity: 0, scale: 0.82 }, { opacity: 0.28, scale: 1, duration: 1.0, ease: "power2.out" }, 9.0);

      tl.fromTo(byId("f06-practice-loop-result-mark"), { opacity: 0, scale: 0 }, { opacity: 1, scale: 1, duration: 0.58, ease: "power3.out" }, 10.22);
      tl.fromTo(byId("f06-practice-loop-result-label"), { opacity: 0, x: 34 }, { opacity: 1, x: 0, duration: 0.64, ease: "power3.out" }, 10.58);

        tl.fromTo(tool, { opacity: 0, scale: 0.84 }, { opacity: 0.4, scale: 1, duration: 0.34, ease: "power3.out" }, at);
        tl.to(tool, { x: drift.x, y: drift.y, opacity: 0.08, color: "#64748b", duration: 1.55, ease: "power2.out" }, at + 0.22);
